name: Validate wedding planner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build site
        run: npm run build
      - name: Ensure committed Pages files are current
        run: |
          git diff --exit-code -- index.html assets .pages-manifest.json .nojekyll
          test -z "$(git ls-files --others --exclude-standard -- index.html assets .pages-manifest.json .nojekyll)"
